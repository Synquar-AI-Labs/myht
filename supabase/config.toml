project_id = "myht"

[auth]
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 6

[auth.email.template.confirmation]
subject = "Your confirmation code"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Your password reset code"
content_path = "./supabase/templates/recovery.html"

[functions.transcribe-audio]
verify_jwt = true
[analytics]
enabled = false

[remotes.staging]
project_id = "lefqfxkvujqnukgzaviz"

# CLI 2.109.1 defaults vector storage to enabled and would send an enable
# update. False skips that feature entirely; it does not disable a hosted one.
[remotes.staging.storage.vector]
enabled = false

# First staging check on this Mac. Replace BOTH URL settings when hosting is chosen.
[remotes.staging.auth]
site_url = "http://localhost:5188"
additional_redirect_urls = ["http://localhost:5188", "http://localhost:5188/auth"]
enable_signup = true
minimum_password_length = 8

[remotes.staging.auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 6

[remotes.staging.auth.email.template.confirmation]
subject = "Your confirmation code"
content_path = "./supabase/templates/confirmation.html"

[remotes.staging.auth.email.template.recovery]
subject = "Your password reset code"
content_path = "./supabase/templates/recovery.html"
# Omission does NOT preserve hosted Auth rate limits: config push supplies CLI
# defaults. After approval, preview first and pin any differing hosted values
# before applying (docs/STAGING.md section 5). Never guess remote values.
