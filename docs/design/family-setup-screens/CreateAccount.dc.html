<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8a6240}a:hover{color:#6b4a2d}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 28px 36px; background: #faf7f2; color: #26201a; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 24px">
  <button type="button" style="align-self: flex-start; display: flex; align-items: center; gap: 4px; height: 44px; padding: 0 8px 0 0; background: none; border: 0; font-family: inherit; font-size: 16px; font-weight: 600; color: #8a6240">
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    Back
  </button>
  <h1 style="margin: 0; font-family: 'DM Serif Display', Georgia, serif; font-weight: 400; font-size: 34px; line-height: 1.12">Create your account</h1>
  <div style="display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="a1-name" style="font-size: 15px; font-weight: 600">Your name</label>
      <input id="a1-name" type="text" placeholder="First name is enough" style="height: 54px; box-sizing: border-box; padding: 0 16px; border: 1.5px solid #b9ae9c; border-radius: 14px; background: #ffffff; font-family: inherit; font-size: 17px; color: #26201a">
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="a1-email" style="font-size: 15px; font-weight: 600">Email</label>
      <input id="a1-email" type="email" placeholder="you@example.com" style="height: 54px; box-sizing: border-box; padding: 0 16px; border: 1.5px solid #b9ae9c; border-radius: 14px; background: #ffffff; font-family: inherit; font-size: 17px; color: #26201a">
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="a1-password" style="font-size: 15px; font-weight: 600">Password</label>
      <input id="a1-password" type="password" placeholder="Choose a password" style="height: 54px; box-sizing: border-box; padding: 0 16px; border: 1.5px solid #b9ae9c; border-radius: 14px; background: #ffffff; font-family: inherit; font-size: 17px; color: #26201a">
      <span style="font-size: 14px; line-height: 1.4; color: #6f665b">At least 8 characters.</span>
    </div>
  </div>
  <button type="button" style="height: 56px; border: 0; border-radius: 14px; background: #26201a; color: #ffffff; font-family: inherit; font-size: 17px; font-weight: 700">Continue</button>
  <p style="margin: 0; font-size: 15px; line-height: 1.45; color: #6f665b">Next, we email you a 6-digit code to check the address. You do that once.</p>
</div>
</x-dc>
