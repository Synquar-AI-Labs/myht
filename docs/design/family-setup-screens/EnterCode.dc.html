<head>

<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8a6240}a:hover{color:#6b4a2d}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 28px 36px; background: #faf7f2; color: #26201a; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 24px">
  <button type="button" style="align-self: flex-start; display: flex; align-items: center; gap: 4px; height: 44px; padding: 0 8px 0 0; background: none; border: 0; font-family: inherit; font-size: 16px; font-weight: 600; color: #8a6240">
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    Back
  </button>
  <div style="display: flex; flex-direction: column; gap: 12px">
    <h1 style="margin: 0; font-family: 'DM Serif Display', Georgia, serif; font-weight: 400; font-size: 34px; line-height: 1.12">Check your email</h1>
    <p style="margin: 0; font-size: 17px; line-height: 1.5; color: #4a4238">We sent a 6-digit code to <strong>you@example.com</strong>. Type it here to sign in.</p>
  </div>
  <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
    <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 1" style="height: 62px; box-sizing: border-box; padding: 0; border: 1.5px solid #b9ae9c; border-radius: 12px; background: #ffffff; font-family: inherit; font-size: 26px; font-weight: 700; text-align: center; color: #26201a">
    <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 2" style="height: 62px; box-sizing: border-box; padding: 0; border: 1.5px solid #b9ae9c; border-radius: 12px; background: #ffffff; font-family: inherit; font-size: 26px; font-weight: 700; text-align: center; color: #26201a">
    <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 3" style="height: 62px; box-sizing: border-box; padding: 0; border: 1.5px solid #b9ae9c; border-radius: 12px; background: #ffffff; font-family: inherit; font-size: 26px; font-weight: 700; text-align: center; color: #26201a">
    <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 4" style="height: 62px; box-sizing: border-box; padding: 0; border: 1.5px solid #b9ae9c; border-radius: 12px; background: #ffffff; font-family: inherit; font-size: 26px; font-weight: 700; text-align: center; color: #26201a">
    <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 5" style="height: 62px; box-sizing: border-box; padding: 0; border: 1.5px solid #b9ae9c; border-radius: 12px; background: #ffffff; font-family: inherit; font-size: 26px; font-weight: 700; text-align: center; color: #26201a">
    <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 6" style="height: 62px; box-sizing: border-box; padding: 0; border: 1.5px solid #b9ae9c; border-radius: 12px; background: #ffffff; font-family: inherit; font-size: 26px; font-weight: 700; text-align: center; color: #26201a">
  </div>
  <div style="display: flex; flex-direction: column; gap: 4px">
    <button type="button" style="height: 56px; border: 0; border-radius: 14px; background: #26201a; color: #ffffff; font-family: inherit; font-size: 17px; font-weight: 700">Sign in</button>
    <button type="button" style="height: 48px; background: none; border: 0; font-family: inherit; font-size: 16px; font-weight: 600; color: #8a6240">Send the code again</button>
  </div>
  <p style="margin: 0; font-size: 15px; line-height: 1.45; color: #6f665b">It can take a minute to arrive. Look in spam too. A phone or tablet stays signed in, so most days nobody does this.</p>
</div>

</html>
